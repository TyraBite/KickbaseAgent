name: Daily Kickbase Report

on:
  schedule:
    - cron: '0 7 * * *' # ~7:00 UTC, ~8-9 Uhr MEZ/MESZ (Drift zwischen Sommer-/Winterzeit akzeptiert)
  workflow_dispatch: {}

jobs:
  daily-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch data, build prompt, send to Discord
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Commit updated snapshot database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kickbase.db
          git diff --cached --quiet || git commit -m "Taeglicher Snapshot $(date -u +%F)"
          git push
