name: Dashboard Update (Heavy, Marktwerte + ML)

on:
  schedule:
    # einmal/Tag um 22:05 Europe/Berlin (CET-Basis/Winterzeit-Aequivalent:
    # 21:05 UTC). Waehrend CEST (Sommerzeit) verschiebt sich das lokal auf
    # ca. 23:05 Uhr - Drift zwischen CET/CEST akzeptiert, wie bisher bei
    # dashboard.yml (kein DST-Erkennungs-Code, bewusst einfach gehalten).
    - cron: '7 21 * * *' # 21:07 statt 21:05 UTC - nur knapp verschoben, um der :05-Lastspitze auszuweichen; User will neue Marktwerte so frueh wie moeglich, deshalb kein grosser Sprung wie bei dashboard.yml
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dashboard-marktwerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Fetch data, build dashboard (voller Marktwert-Lauf)
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUE_ID: ${{ secrets.KICKBASE_LEAGUE_ID }}
          KICKBASE_LEAGUE_START_BUDGET: '80000000'
          KICKBASE_LEAGUE_START_DATE: ${{ secrets.KICKBASE_LEAGUE_START_DATE }}
          FIRESTORE_ENABLED: '1'
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: python -m src.dashboard_export
