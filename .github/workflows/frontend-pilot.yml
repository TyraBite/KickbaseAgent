name: Frontend Pilot Deploy

# Baut das React/Vite/Tailwind-Frontend (frontend/) und deployt es als
# alleiniges UI unter .../KickbaseAgent/. Die alte, handgepflegte index.html
# ist seit dem Cutover (2026-07-29) entfernt (Commit dd964a0) - dieser
# Workflow ist der einzige Deploy-Pfad, kein /old/-Fallback mehr.

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-pilot.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          cp -r frontend/dist/. site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
