name: Frontend Pilot Deploy

# Baut das neue React/Vite/Tailwind-Frontend (frontend/) und deployt es als
# Standard-UI unter .../KickbaseAgent/. Die alte, unveraenderte index.html
# bleibt separat unter .../KickbaseAgent/old/ erreichbar (Cutover
# 2026-07-29, Phase 6 Sub-Projekt 4 - vorher lief das neue Frontend
# parallel unter /preview/, siehe Git-Historie).

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'index.html'
      - '.github/workflows/frontend-pilot.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p site/old
          cp -r frontend/dist/. site/
          cp index.html site/old/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
