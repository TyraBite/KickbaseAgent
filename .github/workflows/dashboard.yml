name: Dashboard Export

on:
  schedule:
    - cron: '15 */2 * * *' # alle 2h zur Minute :15 (Drift zwischen CET/CEST akzeptiert, wie bisher)
  workflow_dispatch: {}

jobs:
  dashboard-export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Firebase service account key
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/firebase-service-account.json"

      - name: Fetch data, build dashboard
        env:
          KICKBASE_EMAIL: ${{ secrets.KICKBASE_EMAIL }}
          KICKBASE_PASSWORD: ${{ secrets.KICKBASE_PASSWORD }}
          KICKBASE_LEAGUE_START_BUDGET: '80000000'
          FIRESTORE_ENABLED: '1'
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: python -m src.dashboard_export

      - name: Commit updated dashboard and snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kickbase.db
          git diff --cached --quiet || git commit -m "Dashboard-Update $(date -u +%F' '%H:%M)"
          git push
